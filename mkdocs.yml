site_name: Sillon Documentation
site_description: log, track, and analyze simulation runs.
repo_url: https://github.com/balerat/sillon
repo_name: sillon

theme:
  name: material
  custom_dir: overrides
  favicon: favicon.svg
  logo: favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: blue grey
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # No `paths`: the package is installed (editable) in the docs build,
          # so every sub-package imports by name.
          options:
            docstring_style: google
            filters: ["!^_"]          # hide private members
            show_root_heading: true
            members_order: source
            show_source: false

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
      - Core concepts: getting-started/concepts.md
  - Guide:
      - Logging runs: guide/logging.md
      - Querying and analysis: guide/analysis.md
      - Working with projects: guide/projects.md
      - Provenance and lineage: guide/provenance.md
      - Troubleshooting: guide/troubleshooting.md
  - Reference:
      - Command line: reference/cli.md
      - sillonpy: reference/sillonpy.md
      - sillonlab: reference/sillonlab.md
  - Contributing & Internals:
      - Contributing: dev/contributing.md
      - Development setup: dev/development.md
      - Architecture: dev/architecture.md
      - Internal reference:
          - silloncore: dev/internals/silloncore.md
          - silloncommon: dev/internals/silloncommon.md
